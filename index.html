<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Gia phả họ — Cây gia phả trực tuyến</title>
<meta name="description" content="Cây gia phả trực tuyến họ Hồ — xem quan hệ, ngày giỗ (âm lịch), tên tự và tra cứu dòng họ." />

<!-- PWA: cài ra màn hình chính & chạy offline -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#9B2D20" />
<meta name="referrer" content="no-referrer" />
<link rel="icon" href="favicon-64.png" sizes="64x64" type="image/png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Gia phả Hồ" />

<!-- Phông chữ hỗ trợ đầy đủ dấu tiếng Việt -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif:wght@500;600;700&display=swap" rel="stylesheet">

<!-- Thư viện vẽ cây: family-chart (cần d3 nạp trước) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/family-chart@0.9.0/dist/styles/family-chart.css">

<style>
  :root{
    --paper:#ECE7DA;        /* nền giấy cũ, ngả xám ấm */
    --paper-2:#E2DAC7;
    --card:#FBF8F1;         /* mặt thẻ */
    --ink:#3E5C76;          /* mực */
    --ink-soft:#6C6354;
    --line:#E0D7C2;
    --cinnabar:#9B2D20;     /* son đỏ — màu dấu triện */
    --cinnabar-2:#7E2017;
    --gold:#B0863A;         /* nhũ vàng — nét chỉ */
    --male:#3E5C76;         /* nam */
    --female:#A23B2D;       /* nữ */
    --top: calc(64px + env(safe-area-inset-top, 0px));   /* chiều cao thanh trên + tai thỏ */
  }

  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:'Be Vietnam Pro',system-ui,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(120% 120% at 0% 0%, #F3EFE4 0%, var(--paper) 55%, var(--paper-2) 100%);
    overflow:hidden;
  }

  /* ------- Thanh trên cùng ------- */
  header.topbar{
    position:fixed; inset:0 0 auto 0; z-index:30;
    height:var(--top); display:flex; align-items:center; gap:16px;
    padding:env(safe-area-inset-top,0px) 18px 0;
    background:rgba(236,231,218,.82);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .seal{
    flex:0 0 auto; width:42px; height:42px; border-radius:7px;
    background:var(--cinnabar);
    color:#F6E6C8; font-family:'Noto Serif',serif; font-weight:700; font-size:22px;
    display:grid; place-items:center;
    box-shadow:inset 0 0 0 2px rgba(246,230,200,.35), 0 2px 8px rgba(126,32,23,.35);
    transform:rotate(-2deg);
  }
  .titles{display:flex; flex-direction:column; line-height:1.1; min-width:0}
  .titles .eyebrow{font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--cinnabar); font-weight:600}
  .titles h1{
    margin:2px 0 0; font-family:'Noto Serif',serif; font-weight:700;
    font-size:20px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .spacer{flex:1 1 auto}

  /* ô tìm người do family-chart đổ vào */
  #search-cont{ position:relative; width:min(280px,42vw); }
  .legend{display:flex; gap:14px; align-items:center; font-size:12px; color:var(--ink-soft)}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
  .legend .m{background:var(--male)} .legend .f{background:var(--female)}
  @media (max-width:720px){
    .legend{display:none}
    .titles .eyebrow{display:none}
    .titles h1{font-size:16px}
    header.topbar{ gap:10px; padding-left:12px; padding-right:12px }
    .seal{ width:34px; height:34px; font-size:18px }
    #search-cont{ width:48vw }

    /* Điều khiển: dải cuộn ngang ở đáy, không che cây */
    .controls{
      left:0; right:0; bottom:0; gap:8px;
      padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));
      flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch;
      background:linear-gradient(180deg, rgba(236,231,218,0), rgba(236,231,218,.94) 45%);
      scrollbar-width:none;
    }
    .controls::-webkit-scrollbar{ display:none }
    .controls .btn{ flex:0 0 auto; padding:11px 14px; font-size:14px }
    select.sel{ max-width:none }

    /* Bảng chi tiết: tấm trượt từ dưới lên */
    #detail{
      top:auto; left:0; right:0; bottom:0; width:100%; max-width:none;
      height:88vh; border-left:none; border-top:1px solid var(--line);
      border-radius:18px 18px 0 0; box-shadow:0 -14px 44px rgba(42,38,32,.24);
      transform:translateY(103%);
    }
    #detail::before{ content:""; position:absolute; top:8px; left:50%; transform:translateX(-50%);
      width:44px; height:5px; border-radius:3px; background:var(--line); z-index:1 }
    .d-head{ padding-top:22px }
    .d-actions{ padding-bottom:calc(14px + env(safe-area-inset-bottom,0px)) }

    /* Các cửa sổ (kiểm tra / lịch giỗ / tra quan hệ): tấm trượt đáy */
    #checker, #gio, #rel{
      top:auto; left:0; right:0; bottom:0; transform:translateY(103%);
      width:100%; max-width:none; max-height:90vh;
      border-radius:18px 18px 0 0;
    }
    #checker.open, #gio.open, #rel.open{ transform:translateY(0) }
    .chk-body{ padding-bottom:calc(18px + env(safe-area-inset-bottom,0px)) }

    /* Tra quan hệ: xếp dọc cho dễ bấm */
    .rel-pickers{ flex-direction:column; align-items:stretch }
    .rel-swap{ width:100%; height:36px }
    .gio-item{ flex-wrap:wrap }
    .gio-when{ width:auto }
    .gio-days{ width:100%; text-align:left; margin-top:4px }
  }

  /* ------- Khung cây ------- */
  #tree{ position:fixed; top:var(--top); left:0; right:0; bottom:0; }
  .f3{ width:100%; height:100%; }

  /* Theme lại thẻ của family-chart cho hợp tông gia phả */
  .f3{
    --male-color:var(--card); --female-color:var(--card); --genderless-color:var(--card);
    --background-color:transparent; --text-color:var(--ink);
    font-family:'Be Vietnam Pro',sans-serif;
  }
  .f3 div.card-inner{
    border:1px solid var(--line); border-radius:11px; overflow:hidden;
    box-shadow:0 1px 0 rgba(42,38,32,.03), 0 8px 18px rgba(42,38,32,.10);
  }
  .f3 div.card-male   .card-inner{ border-left:4px solid var(--male) }
  .f3 div.card-female .card-inner{ border-left:4px solid var(--female) }
  .f3 div.card-image-rect{ width:204px }
  .f3 div.card-image-rect .person-icon,
  .f3 div.card-image-rect img{ height:64px; width:64px; border-radius:9px }
  .f3 div.card-male   .person-icon svg{ background:#E7ECF1 !important; color:#9fb0c0 }
  .f3 div.card-female .person-icon svg{ background:#F2E2DF !important; color:#c19a93 }
  .f3 .card-label [data-rel-type]{}
  .f3 div.card-image-rect div.card-label > div:first-child{
    font-family:'Noto Serif',serif; font-weight:600; font-size:15px; color:var(--ink); line-height:1.25;
  }
  .f3 div.card-image-rect div.card-label > div:nth-child(2){
    font-size:12px; font-style:italic; color:var(--cinnabar); margin-top:1px;
  }
  .f3 div.card-image-rect div.card-label > div:nth-child(3){
    font-size:12px; color:var(--ink-soft); margin-top:1px;
  }
  .f3 div.card-image-rect div.card-label > div:empty{ display:none }
  .f3 div.card-main .card-inner{
    outline:0; border-color:transparent;
    box-shadow:0 0 0 2px var(--cinnabar), 0 10px 26px rgba(155,45,32,.22);
  }
  .f3 .link_particles{ stroke:var(--gold) }

  /* vạch ngăn giữa các đời (vẽ trong lớp .view nên pan/zoom theo cây) */
  .f3 .gen-sep{ pointer-events:none }
  .f3 .gen-sep-line{ stroke:var(--gold); stroke-width:1.5; stroke-dasharray:5 8; opacity:.55 }
  /* đường nối giữa các thẻ: đổi từ trắng sang đen cho dễ nhìn */
  .f3 .link{ fill:none !important; stroke:#163C5F !important; stroke-width:var(--link-sw, 2) !important; opacity:1 !important }

  /* lớp phủ nhãn đời "dính" — luôn hiển thị dù zoom/kéo */
  #gen-labels{ position:absolute; inset:0; z-index:6; pointer-events:none; overflow:hidden }
  .gen-chip{ position:absolute; left:10px; top:0;
    background:rgba(155,45,32,.93); color:#F6E6C8;
    font-family:'Noto Serif',serif; font-weight:700; font-size:13px;
    padding:3px 11px; border-radius:999px; white-space:nowrap;
    box-shadow:inset 0 0 0 1px rgba(246,230,200,.25), 0 3px 10px rgba(126,32,23,.35) }

  /* ------- Bảng chi tiết ------- */
  #detail{
    position:fixed; top:var(--top); right:0; bottom:0; width:340px; max-width:92vw; z-index:40;
    background:linear-gradient(180deg,#FCFAF4,#F6F1E6);
    border-left:1px solid var(--line);
    box-shadow:-14px 0 40px rgba(42,38,32,.14);
    transform:translateX(105%); visibility:hidden;
    transition:transform .28s cubic-bezier(.2,.7,.2,1), visibility .28s;
    display:flex; flex-direction:column;
  }
  #detail.open{ transform:none; visibility:visible }
  .d-head{ position:relative; padding:22px 20px 16px; border-bottom:1px solid var(--line) }
  .d-head .gen{ font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--cinnabar); font-weight:600 }
  .d-photo{
    width:96px; height:96px; border-radius:12px; object-fit:cover; margin:10px 0 12px;
    background:#EDE6D5; border:1px solid var(--line);
    display:grid; place-items:center; font-family:'Noto Serif',serif; font-size:34px; color:#b6a888;
  }
  .d-name{ font-family:'Noto Serif',serif; font-weight:700; font-size:23px; margin:0; line-height:1.15 }
  .d-sub{ color:var(--ink-soft); font-size:14px; margin-top:6px }
  .d-chip{ display:inline-block; font-size:12px; padding:3px 10px; border-radius:999px; margin-top:10px;
           border:1px solid var(--line); background:#fff }
  .d-chip.m{ color:var(--male); border-color:#cdd8e2 }
  .d-chip.f{ color:var(--female); border-color:#e6cdc8 }
  .d-body{ padding:16px 20px; overflow:auto; flex:1 1 auto }
  .d-row{ padding:11px 0; border-bottom:1px dashed var(--line) }
  .d-row .k{ font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft) }
  .d-row .v{ font-size:15px; margin-top:3px; white-space:pre-wrap }
  .d-actions{ padding:14px 20px; border-top:1px solid var(--line); display:flex; gap:10px }
  .btn{
    font:inherit; font-weight:600; font-size:14px; cursor:pointer;
    border-radius:9px; padding:10px 14px; border:1px solid var(--line);
    background:#fff; color:var(--ink); transition:.15s;
  }
  .btn:hover{ border-color:var(--gold) }
  .btn.primary{ background:var(--cinnabar); border-color:var(--cinnabar); color:#F6E6C8 }
  .btn.primary:hover{ background:var(--cinnabar-2) }
  .d-close{ position:absolute; top:12px; right:12px; width:34px; height:34px; border-radius:8px;
            border:1px solid var(--line); background:#fff; cursor:pointer; font-size:18px; color:var(--ink-soft) }

  /* ------- Điều khiển góc dưới ------- */
  .controls{ position:fixed; left:16px; bottom:16px; z-index:35; display:flex; gap:8px; flex-wrap:wrap }
  .controls .btn{ box-shadow:0 4px 14px rgba(42,38,32,.12) }

  /* ------- Băng thông báo (dữ liệu mẫu / lỗi) ------- */
  #banner{
    position:fixed; left:50%; bottom:16px; transform:translateX(-50%); z-index:50;
    max-width:min(560px,92vw); padding:11px 16px; border-radius:10px; font-size:13.5px;
    background:#2A2620; color:#F3EEDF; box-shadow:0 10px 30px rgba(0,0,0,.25);
    display:none;
  }
  #banner.show{ display:block }
  #banner b{ color:#F6CF5B }

  /* màn chờ */
  #loader{ position:fixed; top:var(--top); left:0; right:0; bottom:0; display:grid; place-items:center; z-index:20; color:var(--ink-soft); font-size:14px }
  .dot{ width:9px;height:9px;border-radius:50%;background:var(--cinnabar);display:inline-block;animation:b 1s infinite alternate }
  @keyframes b{from{opacity:.25}to{opacity:1}}

  /* nút Kiểm tra khi có lỗi */
  #btn-check.has-error{ border-color:var(--cinnabar); color:var(--cinnabar); font-weight:700 }
  #btn-check.is-clean{ border-color:#5E7E6E; color:#3f5d50 }

  /* ------- Cửa sổ kiểm tra dữ liệu ------- */
  #checker-back{ position:fixed; inset:0; z-index:60; background:rgba(34,30,24,.38); display:none }
  #checker-back.open{ display:block }
  #checker{
    position:fixed; z-index:61; top:50%; left:50%; transform:translate(-50%,-50%) scale(.96);
    width:min(620px,94vw); max-height:82vh; display:none; flex-direction:column;
    background:linear-gradient(180deg,#FCFAF4,#F6F1E6); border:1px solid var(--line);
    border-radius:14px; box-shadow:0 24px 70px rgba(42,38,32,.32); opacity:0; transition:.18s;
  }
  #checker.open{ display:flex; opacity:1; transform:translate(-50%,-50%) scale(1) }
  .chk-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid var(--line) }
  .chk-head h2{ margin:0; font-family:'Noto Serif',serif; font-size:20px }
  .chk-body{ padding:8px 18px 18px; overflow:auto }
  .chk-summary{ display:flex; gap:10px; margin:12px 0 4px; flex-wrap:wrap }
  .pill{ font-size:13px; font-weight:600; padding:5px 12px; border-radius:999px; border:1px solid var(--line); background:#fff }
  .pill.err{ color:var(--cinnabar); border-color:#e6c3bd } .pill.err b{ }
  .pill.warn{ color:#9a6a16; border-color:#e7d4ad }
  .pill.ok{ color:#3f5d50; border-color:#bfd2c7 }
  .chk-group{ margin-top:16px }
  .chk-group h3{ font-size:12px; letter-spacing:.14em; text-transform:uppercase; margin:0 0 8px; color:var(--ink-soft) }
  .chk-item{ display:flex; gap:9px; padding:9px 11px; border-radius:9px; font-size:14px; line-height:1.45; margin-bottom:6px }
  .chk-item.err{ background:#FaF0EE; border:1px solid #eccfc9 }
  .chk-item.warn{ background:#FBF5E7; border:1px solid #ecdcb6 }
  .chk-item .ic{ flex:0 0 auto; font-weight:700 }
  .chk-item.err .ic{ color:var(--cinnabar) } .chk-item.warn .ic{ color:#9a6a16 }
  .chk-clean{ text-align:center; padding:28px 10px; color:#3f5d50; font-size:16px }
  .chk-clean .big{ font-size:40px; display:block; margin-bottom:8px }

  /* Cửa sổ Lịch giỗ dùng chung bố cục với cửa sổ kiểm tra */
  #gio-back{ position:fixed; inset:0; z-index:60; background:rgba(34,30,24,.38); display:none }
  #gio-back.open{ display:block }
  #gio{
    position:fixed; z-index:61; top:50%; left:50%; transform:translate(-50%,-50%) scale(.96);
    width:min(620px,94vw); max-height:82vh; display:none; flex-direction:column;
    background:linear-gradient(180deg,#FCFAF4,#F6F1E6); border:1px solid var(--line);
    border-radius:14px; box-shadow:0 24px 70px rgba(42,38,32,.32); opacity:0; transition:.18s;
  }
  #gio.open{ display:flex; opacity:1; transform:translate(-50%,-50%) scale(1) }
  .gio-item{ display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:10px;
             border:1px solid var(--line); background:#fff; margin-bottom:8px; cursor:pointer; transition:.12s }
  .gio-item:hover{ border-color:var(--gold); background:#FFFDF8 }
  .gio-item.soon{ border-color:#e6c3bd; background:#FBF2F0 }
  .gio-when{ flex:0 0 auto; width:118px }
  .gio-al{ font-family:'Noto Serif',serif; font-weight:600; color:var(--cinnabar); font-size:14px }
  .gio-dl{ font-size:12px; color:var(--ink-soft); margin-top:2px }
  .gio-name{ flex:1 1 auto; font-weight:600; font-size:15px }
  .gio-days{ flex:0 0 auto; font-size:12.5px; color:var(--ink-soft); text-align:right }
  .gio-days b{ color:var(--cinnabar) }

  /* ô chọn chi/nhánh trông như nút */
  select.sel{ -webkit-appearance:none; appearance:none; padding-right:26px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%236C6354'/></svg>");
    background-repeat:no-repeat; background-position:right 10px center; max-width:200px; }

  /* Cửa sổ Tra quan hệ */
  #rel-back{ position:fixed; inset:0; z-index:60; background:rgba(34,30,24,.38); display:none }
  #rel-back.open{ display:block }
  #rel{ position:fixed; z-index:61; top:50%; left:50%; transform:translate(-50%,-50%) scale(.96);
    width:min(620px,94vw); max-height:82vh; display:none; flex-direction:column;
    background:linear-gradient(180deg,#FCFAF4,#F6F1E6); border:1px solid var(--line);
    border-radius:14px; box-shadow:0 24px 70px rgba(42,38,32,.32); opacity:0; transition:.18s; }
  #rel.open{ display:flex; opacity:1; transform:translate(-50%,-50%) scale(1) }
  .rel-pickers{ display:flex; gap:8px; align-items:center; margin:10px 0 6px }
  .rel-pickers select{ flex:1 1 0; min-width:0; font:inherit; font-size:14px; padding:9px 10px;
    border:1px solid var(--line); border-radius:9px; background:#fff }
  .rel-swap{ flex:0 0 auto; width:38px; height:38px; border:1px solid var(--line); background:#fff;
    border-radius:9px; cursor:pointer; font-size:16px; color:var(--ink-soft) }
  .rel-swap:hover{ border-color:var(--gold) }
  #rel-result{ margin-top:8px }
  .rel-line{ font-size:16px; line-height:1.5; padding:6px 0 }
  .rel-term{ color:var(--cinnabar); font-weight:700; font-family:'Noto Serif',serif }
  .rel-note{ font-size:13.5px; color:var(--ink-soft); margin-top:8px }
  .rel-path{ font-size:13px; color:var(--ink-soft); background:#fff; border:1px solid var(--line);
    border-radius:8px; padding:7px 10px; margin-top:6px; font-family:'Noto Serif',serif }
  .rel-foot{ font-size:12px; color:var(--ink-soft); margin-top:14px; font-style:italic }
  /* ================= KHUNG APP: tab + thanh điều hướng dưới ================= */
  :root{ --nav-h: calc(58px + env(safe-area-inset-bottom,0px)); }
  #tree{ bottom:var(--nav-h) }
  body:not([data-tab="tree"]) #tree{ visibility:hidden; pointer-events:none }

  .view{ position:fixed; top:var(--top); left:0; right:0; bottom:var(--nav-h); z-index:10;
    overflow-y:auto; -webkit-overflow-scrolling:touch; display:none }
  .view.active{ display:block }

  #navbar{ position:fixed; left:0; right:0; bottom:0; z-index:35; height:var(--nav-h);
    display:flex; background:rgba(251,248,241,.97); backdrop-filter:blur(10px);
    border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px) }
  .nav-item{ flex:1 1 0; border:0; background:none; cursor:pointer; color:var(--ink-soft);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    font:inherit; font-size:11px; font-weight:600; padding:6px 2px }
  .nav-item svg{ width:24px; height:24px; stroke:currentColor; fill:none; stroke-width:1.7;
    stroke-linecap:round; stroke-linejoin:round }
  .nav-item svg.filled{ fill:currentColor; stroke:none }
  .nav-item.active{ color:var(--cinnabar) }

  /* điều khiển trên tab Cây */
  #tree-controls{ position:absolute; left:12px; bottom:12px; z-index:5; display:flex; gap:8px; flex-wrap:wrap; max-width:calc(100% - 24px) }
  #tree-controls .btn{ box-shadow:0 4px 14px rgba(42,38,32,.14) }
  @media (max-width:720px){
    #tree-controls{ left:0; right:0; bottom:0; padding:8px 12px; gap:8px; max-width:none;
      flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch;
      background:linear-gradient(180deg, rgba(236,231,218,0), rgba(236,231,218,.92) 45%); scrollbar-width:none }
    #tree-controls::-webkit-scrollbar{ display:none }
    #tree-controls .btn{ flex:0 0 auto }
  }

  /* ---- Trang chủ ---- */
  #home-body{ padding:16px 14px 22px; max-width:640px; margin:0 auto }
  .home-search{ width:100%; text-align:left; display:flex; align-items:center; gap:9px;
    background:var(--card); border:1px solid var(--line); border-radius:12px;

/* Mỗi trường chấp nhận NHIỀU tên cột (tiếng Việt mới hoặc tên cũ).
   So khớp "khoan dung": bỏ dấu, hoa/thường, khoảng trắng, ( ) /.
   Ví dụ tiêu đề "Họ tên" tự khớp 'ho_ten'; "ID cha" khớp 'id_cha'; "(ÂL) Năm sinh" khớp 'al_nam_sinh'. */
const COL = {

  name:      ['ho_ten'],

const SAMPLE_ROWS = [

  {id:'2', ho_ten:'Nguyễn Thị Hoa', gioi_tinh:'Nữ', nam_sinh:'1875', nam_mat:'12/08/1930', doi:'1', id_vo_chong:'1', ghi_chu:'Vợ cả. (Giỗ tự suy từ ngày mất dương lịch.)'},

/* ===========================================================================
   3) CÁC HÀM CHUYỂN ĐỔI DỮ LIỆU PHẲNG (Sheet) → ĐỊNH DẠNG family-chart
=========================================================================== */
const $ = s => document.querySelector(s);
let CHART = null, CARD = null, DATA = [], ORIENT_V = false, ROOT_ID = '', RAW_ROWS = [];

function showBanner(html){ const b=$('#banner'); b.innerHTML=html; b.classList.add('show'); }
function hideBanner(){ $('#banner').classList.remove('show'); }

function normKey(k){
  return String(k||'')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')   // bỏ dấu tiếng Việt
    .replace(/[đĐ]/g,'d')
    .toLowerCase()
    .replace(/[^a-z0-9]+/g,'_')                         // ( ) / khoảng trắng… → _
    .replace(/^_+|_+$/g,'');
}
function get(row, keys){           // đọc 1 ô; keys có thể là chuỗi hoặc mảng tên cột chấp nhận được
  const cands = Array.isArray(keys) ? keys : [keys];
  for(const key of cands){ if(row[key]!=null && row[key]!=='') return row[key]; }
  const wants = cands.map(normKey);
  for(const k in row){ if(wants.includes(normKey(k))) return row[k]; }
  return '';
}
function normGender(v){
  const s=String(v||'').trim().toLowerCase();
  if(['f','nữ','nu','female','gái','gai','bà','ba','w'].includes(s)) return 'F';
  return 'M'; // mặc định nam nếu để trống
}
function splitIds(v){
  return String(v||'').split(/[,;]+/).map(x=>x.trim()).filter(Boolean);  // chỉ tách theo , hoặc ; (ID có thể chứa dấu cách)
}
/* Chuẩn hoá ID: bỏ dấu cách quanh gạch nối để "X - 1", "X-1", "X  -  1" đều thành "X-1" */
function normId(s){ return String(s||'').trim().replace(/\s*-\s*/g,'-').replace(/\s+/g,' '); }
/* Đời nằm ở phần trước dấu gạch trong ID, vd "XII-6" → "XII"; "I" → "I" */
function doiPrefix(id){ return String(id||'').split('-')[0].trim(); }
function romanToInt(s){
  s=String(s||'').toUpperCase().trim();
  if(!/^[IVXLCDM]+$/.test(s)) return null;
  const m={I:1,V:5,X:10,L:50,C:100,D:500,M:1000}; let n=0;
  for(let i=0;i<s.length;i++){ const c=m[s[i]], nx=m[s[i+1]]; if(nx&&c<nx) n-=c; else n+=c; }
  return n;
}
function intToRoman(n){
  n=parseInt(n,10); if(!n||n<1||n>3999) return '';
  const map=[[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];
  let s=''; for(const [v,sym] of map){ while(n>=v){ s+=sym; n-=v; } } return s;
}
const pad2 = n => String(n).padStart(2,'0');
/* Định dạng ngày linh hoạt: chấp nhận 3 mức thông tin
     - "1920"              → "1920"
     - "08/1920" hoặc "8-1920"   → "08/1920"        (tháng/năm)
     - "15/03/1920"        → "15/03/1920"           (ngày/tháng/năm)
   Nếu không phải dạng số (vd can-chi, "mùng 8 tháng Giêng…") thì giữ nguyên chữ. */
function formatDate(s){
  s=String(s||'').trim(); if(!s) return '';
  let m;
  if((m=s.match(/^(\d{1,2})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{3,4})$/)))
    return `${pad2(m[1])}/${pad2(m[2])}/${m[3]}`;
  if((m=s.match(/^(\d{1,2})\s*[\/\-.]\s*(\d{3,4})$/)))
    return `${pad2(m[1])}/${m[2]}`;
  if((m=s.match(/^(\d{3,4})$/)))
    return m[1];
  return s; // văn bản tự do (âm lịch can-chi…)
}
function yearOf(s){
  const parts=String(s||'').split(/[^\d]+/).filter(Boolean);
  const y=parts.find(p=>p.length>=3);
  return y || '';
}
/* Tên tự: ưu tiên cột "Tên tự"; nếu trống thì lấy giá trị không-phải-link ở cột "Ảnh"
   (để vẫn hiện đúng trong lúc dữ liệu cột Ảnh chưa dọn xong) */
function tenTuOf(r){
  const t=String(get(r,COL.ten_tu)||'').trim(); if(t) return t;
  const a=String(get(r,COL.photo)||'').trim();
  return (a && !/^(https?:\/\/|data:)/i.test(a)) ? a : '';
}
/* Chuyển link Google Drive (link chia sẻ dạng trang xem) thành link ẢNH trực tiếp.
   Hỗ trợ: /file/d/ID/view, open?id=ID, uc?id=ID, thumbnail?id=ID, googleusercontent.com/d/ID.
   Link không phải Drive giữ nguyên. Ảnh phải chia sẻ "Bất kỳ ai có đường liên kết". */
function driveDirect(url){
  const u=String(url||'').trim(); if(!u) return '';
  let m, id='';
  if((m=u.match(/\/file\/d\/([-\w]{15,})/)))                     id=m[1];
  else if((m=u.match(/googleusercontent\.com\/d\/([-\w]{15,})/))) id=m[1];
  else if((m=u.match(/[?&]id=([-\w]{15,})/)))                    id=m[1];
  if(id) return 'https://drive.google.com/thumbnail?id='+id+'&sz=w600';
  return u;
}
function yearsText(b,d){      // dòng năm gọn trên thẻ (chỉ lấy năm dương lịch)
  b=yearOf(b); d=yearOf(d);
  if(b&&d) return b+' – '+d;
  if(b)    return 'Sinh '+b;
  if(d)    return 'Mất '+d;
  return '';
}

/* ---------- TỰ TÍNH ĐỜI (thế hệ) ----------
   Lan truyền từ thuỷ tổ (không có cha mẹ = Đời 1) xuống theo quan hệ con.
   Người kết hôn vào (không có cha mẹ) được gán cùng Đời với vợ/chồng. */
function computeGenerations(data){
  const gen={}; data.forEach(d=>{ gen[d.id] = (d.rels.parents.length===0) ? 1 : null; });
  for(let it=0; it<300; it++){
    let changed=false;
    data.forEach(d=>{
      let g;
      const pg=d.rels.parents.map(p=>gen[p]).filter(x=>x!=null);
      if(pg.length) g = 1 + Math.max(...pg);             // sâu hơn cha/mẹ một bậc
      else { const sg=d.rels.spouses.map(s=>gen[s]).filter(x=>x!=null); g = sg.length ? Math.max(...sg) : 1; }
      if(g!=null && g!==gen[d.id]){ gen[d.id]=g; changed=true; }
    });
    if(!changed) break;
  }
  return gen;
}

/* ---------- ÂM LỊCH (thuật toán Hồ Ngọc Đức, múi giờ VN = 7) ---------- */
function _jdn(dd,mm,yy){const a=Math.floor((14-mm)/12),y=yy+4800-a,m=mm+12*a-3;let j=dd+Math.floor((153*m+2)/5)+365*y+Math.floor(y/4)-Math.floor(y/100)+Math.floor(y/400)-32045;if(j<2299161)j=dd+Math.floor((153*m+2)/5)+365*y+Math.floor(y/4)-32083;return j;}
function _jd2d(jd){let a,b,c;if(jd>2299160){a=jd+32044;b=Math.floor((4*a+3)/146097);c=a-Math.floor((b*146097)/4);}else{b=0;c=jd+32082;}const d=Math.floor((4*c+3)/1461),e=c-Math.floor((1461*d)/4),m=Math.floor((5*e+2)/153);return [e-Math.floor((153*m+2)/5)+1, m+3-12*Math.floor(m/10), b*100+d-4800+Math.floor(m/10)];}
function _nm(k){const T=k/1236.85,T2=T*T,T3=T2*T,dr=Math.PI/180;let J=2415020.75933+29.53058868*k+0.0001178*T2-0.000000155*T3;J+=0.00033*Math.sin((166.56+132.87*T-0.009173*T2)*dr);const M=359.2242+29.10535608*k-0.0000333*T2-0.00000347*T3,Mpr=306.0253+385.81691806*k+0.0107306*T2+0.00001236*T3,F=21.2964+390.67050646*k-0.0016528*T2-0.00000239*T3;let C=(0.1734-0.000393*T)*Math.sin(M*dr)+0.0021*Math.sin(2*dr*M);C=C-0.4068*Math.sin(Mpr*dr)+0.0161*Math.sin(dr*2*Mpr)-0.0004*Math.sin(dr*3*Mpr)+0.0104*Math.sin(dr*2*F)-0.0051*Math.sin(dr*(M+Mpr))-0.0074*Math.sin(dr*(M-Mpr))+0.0004*Math.sin(dr*(2*F+M))-0.0004*Math.sin(dr*(2*F-M))-0.0006*Math.sin(dr*(2*F+Mpr))+0.0010*Math.sin(dr*(2*F-Mpr))+0.0005*Math.sin(dr*(2*Mpr+M));let dt;if(T<-11)dt=0.001+0.000839*T+0.0002261*T2-0.00000845*T3-0.000000081*T*T3;else dt=-0.000278+0.000265*T+0.000262*T2;return Math.floor(J+C-dt+0.5+7/24);}
function _sl(j){const T=(j-2451545.5-7/24)/36525,T2=T*T,dr=Math.PI/180;const M=357.52910+35999.05030*T-0.0001559*T2-0.00000048*T*T2,L0=280.46645+36000.76983*T+0.0003032*T2;let DL=(1.914600-0.004817*T-0.000014*T2)*Math.sin(dr*M)+(0.019993-0.000101*T)*Math.sin(dr*2*M)+0.000290*Math.sin(dr*3*M);let L=(L0+DL)*dr;L=L-Math.PI*2*Math.floor(L/(Math.PI*2));return Math.floor(L/Math.PI*6);}
function _m11(yy){const k=Math.floor((_jdn(31,12,yy)-2415021)/29.530588853);let nm=_nm(k);if(_sl(nm)>=9)nm=_nm(k-1);return nm;}
function _leap(a11){const k=Math.floor((a11-2415021.076998695)/29.530588853+0.5);let last=0,i=1,arc=_sl(_nm(k+i));do{last=arc;i++;arc=_sl(_nm(k+i));}while(arc!=last&&i<14);return i-1;}
function solar2lunar(dd,mm,yy){const dn=_jdn(dd,mm,yy);const k=Math.floor((dn-2415021.076998695)/29.530588853);let ms=_nm(k+1);if(ms>dn)ms=_nm(k);let a11=_m11(yy),b11=a11,ly;if(a11>=ms){ly=yy;a11=_m11(yy-1);}else{ly=yy+1;b11=_m11(yy+1);}const ld=dn-ms+1,diff=Math.floor((ms-a11)/29);let lm=diff+11;if(b11-a11>365){const lo=_leap(a11);if(diff>=lo)lm=diff+10;}if(lm>12)lm-=12;if(lm>=11&&diff<4)ly-=1;return [ld,lm,ly];}
function lunar2solar(ld,lm,ly,leap){let a11,b11;if(lm<11){a11=_m11(ly-1);b11=_m11(ly);}else{a11=_m11(ly);b11=_m11(ly+1);}let off=lm-11;if(off<0)off+=12;if(b11-a11>365){const lo=_leap(a11);let lmth=lo-2;if(lmth<0)lmth+=12;if(leap&&lm!=lmth)return [0,0,0];else if(leap||off>=lo)off+=1;}const k=Math.floor(0.5+(a11-2415021.076998695)/29.530588853);return _jd2d(_nm(k+off)+ld-1);}

const THANG_AL={1:'Giêng',11:'Một',12:'Chạp'};
function tenThangAL(m){ return THANG_AL[m] || String(m); }
/* Lấy ngày & tháng âm lịch từ ô "(ÂL) Năm mất" (số hoặc chữ can-chi) */
function lunarDayMonth(s){
  s=String(s||'').trim().toLowerCase(); if(!s) return null;
  let m;
  // "d-m ..." hoặc "d/m ..." ở đầu (có thể kèm can-chi: "24-10 Mậu Tuất", "8-11 âm lịch")
  if((m=s.match(/^(\d{1,2})\s*[\/\-.]\s*(\d{1,2})\b/))){
    let day=+m[1], month=+m[2];
    if(month>12 && day<=12){ const t=day; day=month; month=t; }   // lỡ ghi tháng-ngày
    if(day>=1&&day<=31&&month>=1&&month<=12) return {day,month};
  }
  // dạng chữ: "mùng 8 tháng 2", "ngày 15 tháng Giêng"
  const dm=s.match(/(?:mùng|mồng|ngày)?\s*(\d{1,2})\s*(?:tháng|thg\.?)\s*(\d{1,2}|giêng|chạp|một)/);
  if(dm){ const mo=dm[2]; const month=mo==='giêng'?1:mo==='chạp'?12:mo==='một'?11:+mo; const day=+dm[1];
          if(day>=1&&day<=31&&month>=1&&month<=12) return {day,month}; }
  return null;
}
function solarDMY(s){ const m=String(s||'').trim().match(/^(\d{1,2})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{3,4})$/); return m?{d:+m[1],mo:+m[2],y:+m[3]}:null; }
/* Ngày giỗ dương lịch sắp tới từ (ngày, tháng) âm lịch */
function nextGio(day, month){
  const today=new Date(); today.setHours(0,0,0,0);
  const ly = solar2lunar(today.getDate(), today.getMonth()+1, today.getFullYear())[2];
  for(let i=0;i<3;i++){
    const [dd,mm,yy]=lunar2solar(day,month,ly+i,0);
    if(!yy) continue;
    const dt=new Date(yy,mm-1,dd); dt.setHours(0,0,0,0);
    if(dt>=today) return {date:dt, days:Math.round((dt-today)/86400000)};
  }
  return null;
}
function fmtDate(d){ return `${pad2(d.getDate())}/${pad2(d.getMonth()+1)}/${d.getFullYear()}`; }

/* Chuyển danh sách dòng (mỗi người 1 dòng) sang mảng family-chart.
   - cha/mẹ lấy từ id_cha, id_me  → quan hệ con cái
   - vợ/chồng từ id_vo_chong (nhiều id, ngăn bằng dấu phẩy) → nhiều vợ/chồng
   - tự suy ra: cha & mẹ của cùng một con là một cặp vợ chồng (kể cả khi quên điền)
   family-chart tự nhóm con theo từng cặp cha–mẹ ⟶ vợ hai và con tạo thành DÒNG PHỤ. */
function transform(rows){
  const map = new Map();
  const valid = new Set();
  rows.forEach(r=>{ const id=normId(get(r,COL.id)); if(id) valid.add(id); });

  rows.forEach(r=>{
    const id=normId(get(r,COL.id)); if(!id) return;
    map.set(id, {
      id,
      data:{
        gender: normGender(get(r,COL.gender)),
        ho_ten: String(get(r,COL.name)||'(chưa rõ tên)').trim(),
        years:  yearsText(get(r,COL.birth), get(r,COL.death)),
        doi:     String(get(r,COL.gen)||'').trim(),
        anh:     (function(){ const v=String(get(r,COL.photo)||'').trim(); return /^(https?:\/\/|data:)/i.test(v)?driveDirect(v):''; })(),
        // tên tự lấy từ cột "Tên tự" (dự phòng: giá trị không-phải-link ở cột "Ảnh")
        tu:      tenTuOf(r),
        // các dòng hiển thị bên phải ảnh trên thẻ (dòng rỗng sẽ tự ẩn)
        card_tu:  (function(){ const t=tenTuOf(r); return t?(t):''; })(),
        card_sinh:(function(){ const b=yearOf(get(r,COL.birth)), d=yearOf(get(r,COL.death)); return b?('Sinh '+b):(d?('Mất '+d):''); })(),
        // ngày tháng (dương lịch & âm lịch), đã định dạng linh hoạt
        sinh_dl: formatDate(get(r,COL.birth)),
        mat_dl:  formatDate(get(r,COL.death)),
        sinh_al: formatDate(get(r,COL.birth_al)),
        mat_al:  formatDate(get(r,COL.death_al)),
        // các trường gia phả bổ sung
        ten_tu:        String(get(r,COL.ten_tu)||'').trim(),
        phap_danh:     String(get(r,COL.phap_danh)||'').trim(),
        nguyen_quan:   String(get(r,COL.nguyen_quan)||'').trim(),
        dinh_cu:       String(get(r,COL.dinh_cu)||'').trim(),
        nghe_nghiep:   String(get(r,COL.nghe_nghiep)||'').trim(),
        nguoi_phung_te:String(get(r,COL.nguoi_phung_te)||'').trim(),
        man_phan:      String(get(r,COL.man_phan)||'').trim(),
        ghi_chu: String(get(r,COL.note)||'').trim(),
        // ghi chú quan hệ (ghi đè quan hệ suy từ ID nếu không trống)
        note_con: String(get(r,COL.note_con)||'').trim(),
        note_cha: String(get(r,COL.note_cha)||'').trim(),
        note_me:  String(get(r,COL.note_me)||'').trim(),
        note_bac: String(get(r,COL.note_bac)||'').trim(),
        // ngày giỗ (ngày,tháng âm lịch): ưu tiên cột ÂL, nếu trống thì suy từ ngày mất dương lịch đầy đủ
        gio: (function(){
          let g = lunarDayMonth(get(r,COL.death_al));
          if(!g){ const sd = solarDMY(get(r,COL.death)); if(sd){ const L=solar2lunar(sd.d,sd.mo,sd.y); g={day:L[0],month:L[1]}; } }
          return g;
        })(),
      },
      rels:{ parents:[], spouses:[], children:[] },
      _father:normId(get(r,COL.father)),
      _mother:normId(get(r,COL.mother)),
      _spouses:splitIds(get(r,COL.spouses)).map(normId),
    });
  });

  const link=(a,b,arr)=>{ if(a&&b&&map.has(a)&&map.has(b)){ const s=map.get(a).rels[arr];
                          if(!s.includes(b)) s.push(b); } };

  for(const p of map.values()){
    const f=valid.has(p._father)?p._father:'';
    const m=valid.has(p._mother)?p._mother:'';
    if(f){ link(p.id,f,'parents'); link(f,p.id,'children'); }
    if(m){ link(p.id,m,'parents'); link(m,p.id,'children'); }
    if(f&&m){ link(f,m,'spouses'); link(m,f,'spouses'); }     // cha+mẹ của con = 1 cặp
    p._spouses.forEach(s=>{ link(p.id,s,'spouses'); link(s,p.id,'spouses'); });
  }

  const data=[...map.values()].map(p=>{ delete p._father; delete p._mother; delete p._spouses; return p; });

  // ĐỜI (độc lập định dạng ID): ưu tiên cột "Đời"; nếu trống thì lấy từ tiền tố ID
  // (số La Mã "XII", hoặc số thường trong "14-3"); cuối cùng mới tự tính từ quan hệ.
  const genAuto = computeGenerations(data);
  const numOr = (s)=>{ const n=parseInt(String(s).replace(/[^0-9]/g,''),10); return (!isNaN(n)&&n>0)?n:null; };
  data.forEach(d=>{
    const col = String(d.data.doi||'').trim();               // giá trị cột "Đời"
    const prefix = doiPrefix(d.id);                          // phần trước dấu "-" của ID
    const fromCol = (romanToInt(col) ?? numOr(col));         // cột: La Mã hoặc số
    const fromId  = (romanToInt(prefix) != null) ? romanToInt(prefix)
                  : (d.id.indexOf('-') !== -1 ? numOr(prefix) : null);  // "14-3"→14; ID trần không suy
    const g = (fromCol && fromCol>0) ? fromCol
            : (fromId && fromId>0)   ? fromId
            : genAuto[d.id];
    d.data.gen_num = g || genAuto[d.id] || 1;
    d.data.doi = String(d.data.gen_num);                     // hiển thị SỐ THƯỜNG
    d.data.gen_auto = genAuto[d.id];
  });

  // chọn người gốc: ưu tiên ROOT_ID, sau đó Đời nhỏ nhất, rồi người không có cha mẹ
  let rootId = (CONFIG.ROOT_ID && map.has(normId(CONFIG.ROOT_ID))) ? normId(CONFIG.ROOT_ID) : '';
  if(!rootId){
    const sorted=[...data].sort((a,b)=>{
      const da=a.data.gen_num||999, db=b.data.gen_num||999;
      if(da!==db) return da-db;
      return (a.rels.parents.length)-(b.rels.parents.length);
    });
    rootId = sorted.length ? sorted[0].id : '';
  }
  return {data, rootId};
}

/* ===========================================================================
   4) VẼ CÂY
=========================================================================== */
function render(data, mainId){
  $('#loader').style.display='none';
  $('#FamilyChart').innerHTML='';
  const main = mainId || '';

  CHART = f3.createChart('#FamilyChart', data)
    .setTransitionTime(0)
    .setCardXSpacing(255)
    .setCardYSpacing(150)
    .setShowSiblingsOfMain(true)
    .setSingleParentEmptyCard(false);

  CARD = CHART.setCardHtml()
    .setStyle('imageRect')
    .setMiniTree(true)                                  // hiện cây nhỏ để bấm mở rộng ông bà / con cháu
    .setCardImageField('anh')
    .setCardDisplay([['ho_ten'],['card_tu'],['card_sinh']])
    .setOnCardClick((e,d)=> openDetail(d.data));        // bấm thẻ → mở bảng chi tiết

  if(main) CHART.updateMainId(main);

  // mặc định: cây nằm NGANG (từ trái sang phải)
  ORIENT_V = false;
  CHART.setOrientationHorizontal();

  // vẽ vạch ngăn các đời sau mỗi lần cập nhật cây
  CHART.setAfterUpdate(drawGenSeparators);

  CHART.updateTree({initial:true, tree_position:'fit'});
}

/* Vẽ nền xen kẽ + đường kẻ ngăn cách giữa các thế hệ (trong nhóm .view nên pan/zoom theo cây).
   Đồng thời lưu danh sách dải đời để lớp phủ nhãn "dính" dùng. */
function drawGenSeparators(){
  try{
    const cont = $('#FamilyChart');
    const svg  = cont && cont.querySelector('svg.main_svg');
    const view = svg && svg.querySelector('g.view');
    const tree = CHART && CHART.store && CHART.store.state && CHART.store.state.tree;
    if(!view || !tree || !tree.data){ GEN_ROWS=[]; buildGenChips(); return; }
    view.querySelectorAll('.gen-sep').forEach(e=>e.remove());

    const horiz = !!tree.is_horizontal;
    const nodes = tree.data.filter(t=> t && t.data && t.data.data && t.data.data.gen_num!=null && !t.data.to_add);
    if(nodes.length < 2){ GEN_ROWS=[]; buildGenChips(); return; }

    const lvl  = t => horiz ? t.x : t.y;
    const span = t => horiz ? t.y : t.x;
    const rows = new Map(); let sMin=Infinity, sMax=-Infinity;
    nodes.forEach(t=>{
      const k=Math.round(lvl(t));
      if(!rows.has(k)) rows.set(k,{k,dois:{}});
      const r=rows.get(k); const doi=t.data.data.doi||''; r.dois[doi]=(r.dois[doi]||0)+1;
      sMin=Math.min(sMin,span(t)); sMax=Math.max(sMax,span(t));
    });
    const arr=[...rows.values()].sort((a,b)=>a.k-b.k);
    arr.forEach(r=> r.doi=Object.entries(r.dois).sort((a,b)=>b[1]-a[1])[0][0]);

    const gap = arr.length>1 ? (arr[1].k-arr[0].k) : 150;
    const pad=420, s1=sMin-pad, s2=sMax+pad;
    const NS='http://www.w3.org/2000/svg';
    const g=document.createElementNS(NS,'g'); g.setAttribute('class','gen-sep');
    const mk=(tag,at)=>{ const e=document.createElementNS(NS,tag); for(const k in at) e.setAttribute(k,at[k]); return e; };

    // đường kẻ ngăn giữa các đời
    for(let i=1;i<arr.length;i++){
      const mid=(arr[i-1].k+arr[i].k)/2;
      g.appendChild(horiz
        ? mk('line',{x1:mid,x2:mid,y1:s1,y2:s2,class:'gen-sep-line'})
        : mk('line',{x1:s1,x2:s2,y1:mid,y2:mid,class:'gen-sep-line'}));
    }
    view.insertBefore(g, view.firstChild);   // nằm dưới links & cards

    // lưu cho lớp phủ nhãn "dính"
    GEN_ROWS = arr.map(r=>({k:r.k, doi:r.doi}));
    GEN_HORIZ = horiz;
    buildGenChips();
  }catch(e){ /* bỏ qua, không chặn việc vẽ cây */ }
}

/* Tạo các "chip" nhãn đời cho lớp phủ cố định (chỉ tạo lại khi danh sách đời đổi) */
function buildGenChips(){
  const overlay=$('#gen-labels'); if(!overlay) return;
  const key = GEN_ROWS.map(r=>r.doi).join('|')+'/'+GEN_HORIZ;
  if(overlay.dataset.key===key) return;          // không đổi → giữ nguyên
  overlay.dataset.key=key; overlay.innerHTML='';
  GEN_CHIPS = GEN_ROWS.map(r=>{
    const c=document.createElement('div'); c.className='gen-chip'; c.textContent='Đời '+r.doi;
    c.style.display='none'; overlay.appendChild(c); return c;
  });
}

/* Mỗi khung hình: đặt nhãn đời dính ở mép màn hình theo vị trí dải đời hiện tại */
function syncGenLabels(){
  const overlay=$('#gen-labels'); if(!overlay || !GEN_ROWS.length || !GEN_CHIPS.length) return;
  const cont=$('#FamilyChart'); const svg=cont&&cont.querySelector('svg.main_svg'); const view=svg&&svg.querySelector('g.view');
  if(!view) return;
  let M; try{ const c=view.transform.baseVal.consolidate(); if(!c) return; M=c.matrix; }catch(_){ return; }
  const k = GEN_HORIZ ? M.a : M.d;
  const t = GEN_HORIZ ? M.e : M.f;
  const W = cont.clientWidth, H = cont.clientHeight;
  const limit = GEN_HORIZ ? W : H;
  const gap = GEN_ROWS.length>1 ? (GEN_ROWS[1].k-GEN_ROWS[0].k) : 150;
  for(let i=0;i<GEN_ROWS.length;i++){
    const chip=GEN_CHIPS[i]; if(!chip) continue;
    const prevGap = i>0 ? GEN_ROWS[i].k-GEN_ROWS[i-1].k : gap;
    const nextGap = i<GEN_ROWS.length-1 ? GEN_ROWS[i+1].k-GEN_ROWS[i].k : gap;
    const topS = (GEN_ROWS[i].k - prevGap/2)*k + t;
    const botS = (GEN_ROWS[i].k + nextGap/2)*k + t;
    const visTop=Math.max(topS,2), visBot=Math.min(botS,limit-2);
    if(visBot <= visTop+8){ chip.style.display='none'; continue; }   // dải không nằm trong màn hình
    chip.style.display='';
    const pos=Math.min(Math.max(visTop+6, 6), limit-30);            // dính ở đầu dải đang thấy
    if(GEN_HORIZ){ chip.style.top='10px'; chip.style.left=pos+'px'; }
    else { chip.style.left='10px'; chip.style.top=pos+'px'; }
  }
}
/* Giữ độ dày đường nối ~2px trên màn hình ở mọi mức zoom (thay cho non-scaling-stroke bị lỗi trên iOS) */
function syncLinkWidth(){
  const cont=$('#FamilyChart'); const svg=cont&&cont.querySelector('svg.main_svg'); const view=svg&&svg.querySelector('g.view');
  if(!view) return;
  let k=1; try{ const c=view.transform.baseVal.consolidate(); if(c && c.matrix.a) k=c.matrix.a; }catch(_){ }
  const w = 2/(Math.abs(k)||1);            // stroke-width (đơn vị cây) để sau khi *k ≈ 2px
  document.documentElement.style.setProperty('--link-sw', w.toFixed(3));
}
if(typeof requestAnimationFrame!=='undefined'){
  (function genLabelLoop(){ syncGenLabels(); syncLinkWidth(); requestAnimationFrame(genLabelLoop); })();
}

    try{

      fromSheet = true;
      try{ localStorage.setItem('giapha_cache', JSON.stringify(rows)); }catch(_){}
    }catch(err){
      // dùng bản lưu ở máy nếu có, nếu không thì dữ liệu mẫu
      let cached=null; try{ cached=JSON.parse(localStorage.getItem('giapha_cache')||'null'); }catch(_){}
      if(cached && cached.length){ rows=cached; showBanner('Không tải được Google Sheet — đang dùng <b>bản lưu ngoại tuyến</b> gần nhất.'); }
      else { rows=SAMPLE_ROWS; showBanner('Không tải được Google Sheet ('+err.message+') — đang dùng <b>dữ liệu mẫu</b>.'); }
    }
  } else {

    showBanner('Đang chạy bằng <b>dữ liệu mẫu</b>. Mở file, điền <b>SHEET_ID</b> trong khối CONFIG để dùng gia phả của bạn.');
  }

  const {data, rootId} = transform(rows);
  DATA = data; RAW_ROWS = rows; ROOT_ID = rootId;
  if(!data.length){ $('#loader').textContent='Không có dữ liệu để hiển thị.'; return; }

}

/* ===========================================================================
   6) KIỂM TRA DỮ LIỆU — soát các lỗi nhập liệu thường gặp với mã số
=========================================================================== */
function validateRows(rows){
  const out={error:[], warn:[]};
  const seen=new Map();          // mã -> họ tên (lần đầu gặp)
  const dup=new Set();
  const people = rows.map(r=>({
    ma:    normId(get(r,COL.id)),
    ten:   String(get(r,COL.name)||'').trim(),
    gioi:  normGender(get(r,COL.gender)),
    gioiRaw:String(get(r,COL.gender)||'').trim(),
    cha:   normId(get(r,COL.father)),
    me:    normId(get(r,COL.mother)),
    vc:    splitIds(get(r,COL.spouses)).map(normId),
    doiCol:String(get(r,COL.gen)||'').trim(),
    doiId: (function(){ const id=normId(get(r,COL.id)); const p=doiPrefix(id); const rm=romanToInt(p);
             if(rm!=null) return rm; if(id.indexOf('-')!==-1){ const n=parseInt(p,10); if(!isNaN(n)&&n>0) return n; } return null; })(),
  })).filter(p=> p.ma || p.ten);   // bỏ dòng trống hẳn

  people.forEach(p=>{ if(!p.ma) return; if(seen.has(p.ma)) dup.add(p.ma); else seen.set(p.ma,p.ten); });
  const exists = m => seen.has(m);
  const tag = m => `ID ${m}${seen.get(m)?' – '+seen.get(m):''}`;
  const who = p => p.ma ? tag(p.ma) : `"${p.ten||'(trống)'}"`;
  const byId = m => people.find(x=>x.ma===m);

  dup.forEach(m=> out.error.push(`${tag(m)} bị TRÙNG mã — mỗi người phải có một mã riêng.`));

  people.forEach(p=>{
    if(!p.ma){ out.error.push(`Người tên "${p.ten}" chưa có ID.`); return; }
    if(!p.ten)     out.warn.push(`${tag(p.ma)} thiếu Họ tên.`);
    if(!p.gioiRaw) out.warn.push(`${tag(p.ma)} thiếu Giới tính (mặc định hiểu là Nam).`);

    const ref=(val,nhan)=>{
      if(!val) return;
      if(val===p.ma) out.error.push(`${who(p)} tự trỏ tới chính mình ở "${nhan}".`);
      else if(!exists(val)) out.error.push(`${who(p)} có "${nhan}" = ${val} nhưng KHÔNG có ai mang mã này.`);
    };
    ref(p.cha,'ID cha'); ref(p.me,'ID mẹ'); p.vc.forEach(v=>ref(v,'ID vợ/chồng'));

    if(p.cha && exists(p.cha)){ const f=byId(p.cha); if(f && f.gioi!=='M') out.warn.push(`Cha của ${who(p)} là ${tag(p.cha)} nhưng đang để Giới tính Nữ.`); }
    if(p.me  && exists(p.me )){ const m=byId(p.me ); if(m && m.gioi!=='F') out.warn.push(`Mẹ của ${who(p)} là ${tag(p.me )} nhưng đang để Giới tính Nam.`); }
  });

  // vòng lặp tổ tiên: một người là tổ tiên của chính mình
  const par=new Map(); people.forEach(p=>{ if(p.ma) par.set(p.ma,[p.cha,p.me].filter(x=>x&&x!==p.ma&&exists(x))); });
  const cyc=new Set();
  people.forEach(p=>{ if(!p.ma) return;
    const seenA=new Set(); const stack=[...(par.get(p.ma)||[])];
    while(stack.length){ const a=stack.pop(); if(a===p.ma){ cyc.add(p.ma); break; } if(seenA.has(a)) continue; seenA.add(a); (par.get(a)||[]).forEach(x=>stack.push(x)); }
  });
  cyc.forEach(m=> out.error.push(`${tag(m)} nằm trong VÒNG LẶP tổ tiên (là tổ tiên của chính mình) — kiểm tra lại ID cha/ID mẹ.`));

  // các kiểm tra dựa trên quy ước Đời = số La Mã trong ID
  const intDoiCol = s => romanToInt(s) ?? (parseInt(s)||null);
  people.forEach(p=>{
    if(!p.ma) return;
    // 1) cột "Đời" khác đời trong ID
    if(p.doiCol && p.doiId!=null){ const dc=intDoiCol(p.doiCol); if(dc!=null && dc!==p.doiId) out.warn.push(`${tag(p.ma)}: cột "Đời" ghi "${p.doiCol}" khác đời trong ID (${p.doiId}).`); }
    // 2) cha/mẹ phải hơn con đúng 1 đời
    const stepCheck=(ref,nhan)=>{ if(ref&&exists(ref)){ const par=byId(ref); if(par&&par.doiId!=null&&p.doiId!=null&&par.doiId!==p.doiId-1) out.warn.push(`${tag(p.ma)} (đời ${p.doiId}) có "${nhan}" ${tag(ref)} ở đời ${par.doiId} — lệch (đáng lẽ ${p.doiId-1}).`); } };
    stepCheck(p.cha,'ID cha'); stepCheck(p.me,'ID mẹ');
    // 3) vợ/chồng cùng giới tính
    p.vc.forEach(v=>{ if(exists(v)){ const s=byId(v); if(s&&s.gioi===p.gioi) out.warn.push(`${tag(p.ma)} và vợ/chồng ${tag(v)} đang cùng Giới tính — kiểm tra lại.`); } });
    // 4) nhánh tách rời: nam, có con, đời>1 nhưng không có ID cha
    const hasChild = people.some(x=>x.cha===p.ma || x.me===p.ma);
    if(p.gioi==='M' && hasChild && (p.doiId>1) && !p.cha) out.warn.push(`${tag(p.ma)} ở đời ${p.doiId} có con nhưng KHÔNG có "ID cha" → nhánh này đang tách rời khỏi các đời trên (bổ sung ID cha để nối liền).`);
  });

  // gộp trùng lặp thông điệp
  out.error=[...new Set(out.error)]; out.warn=[...new Set(out.warn)];
  return out;
}

/* ===========================================================================
   8) TRA QUAN HỆ giữa hai người (theo huyết thống + hôn phối)
=========================================================================== */
const personById = id => DATA.find(d=>d.id===id);
const personName = id => { const p=personById(id); return p?p.data.ho_ten:'(?)'; };
const birthYear  = id => { const p=personById(id); return p?(parseInt(yearOf(p.data.sinh_dl))||null):null; };
function ancDist(id){ const dist=new Map([[id,0]]); const q=[[id,0]]; while(q.length){ const [c,d]=q.shift(); const p=personById(c); if(!p) continue; p.rels.parents.forEach(pp=>{ if(!dist.has(pp)||dist.get(pp)>d+1){ dist.set(pp,d+1); q.push([pp,d+1]); } }); } return dist; }
function reachableAnc(from,target){ return ancDist(from).has(target); }
function sideOf(low,anc){ const p=personById(low); if(!p) return ''; const fa=p.rels.parents.find(x=>personById(x)&&personById(x).data.gender==='M'); const mo=p.rels.parents.find(x=>personById(x)&&personById(x).data.gender==='F'); if(fa&&reachableAnc(fa,anc)) return 'nội'; if(mo&&reachableAnc(mo,anc)) return 'ngoại'; return ''; }
function linkingParent(id,lca){ const p=personById(id); if(!p) return null; for(const par of p.rels.parents){ if(par===lca || ancDist(par).has(lca)) return par; } return p.rels.parents[0]||null; }
function pathUp(id,lca){ const out=[]; let cur=id,g=0; while(cur&&g++<60){ out.push(personName(cur)); if(cur===lca) break; cur=linkingParent(cur,lca); } return out; }
const _older=(x,y)=> (x&&y)? (x<y) : null;
const tSpouse=g=>g==='M'?'chồng':'vợ';
function tAnc(gn,gA,side){ if(gn===1) return gA==='M'?'cha':'mẹ'; if(gn===2) return (gA==='M'?'ông':'bà')+(side?' '+side:''); if(gn===3) return gA==='M'?'cụ ông':'cụ bà'; if(gn===4) return 'kị'; return `tổ ${gn} đời`; }
function tDes(gn,side){ if(gn===1) return 'con'; if(gn===2) return 'cháu'+(side?' '+side:''); if(gn===3) return 'chắt'; if(gn===4) return 'chút'; return `hậu duệ đời ${gn}`; }
function tSib(g,isOlder,half,spg){ let b=isOlder===null?(g==='M'?'anh/em':'chị/em'):isOlder?(g==='M'?'anh':'chị'):'em'; b+= half?(spg==='M'?' (cùng cha khác mẹ)':spg==='F'?' (cùng mẹ khác cha)':' (nửa dòng)'):' ruột'; return b; }
function tUncle(gU,lpG,olderThanParent){ if(lpG==='M'){ if(gU==='M') return olderThanParent===null?'bác/chú':olderThanParent?'bác':'chú'; return 'cô'; } else { if(gU==='M') return 'cậu'; return 'dì'; } }
function tCous(g,isOlder){ return isOlder===null?(g==='M'?'anh/em họ':'chị/em họ'):isOlder?(g==='M'?'anh họ':'chị họ'):'em họ'; }
function nameBlood(A,B,dA,dB,lca){
  if(dB===0){ const side=sideOf(A.id,lca); return {aToB:tDes(dA,side), bToA:tAnc(dA,B.data.gender,side)}; }
  if(dA===0){ const side=sideOf(B.id,lca); return {aToB:tAnc(dB,A.data.gender,side), bToA:tDes(dB,side)}; }
  if(dA===1&&dB===1){ const shared=A.rels.parents.filter(p=>B.rels.parents.includes(p)); const half=shared.length<2; const spg=shared.length?personById(shared[0]).data.gender:null; const ao=_older(birthYear(A.id),birthYear(B.id)); return {aToB:tSib(A.data.gender,ao,half,spg), bToA:tSib(B.data.gender,ao===null?null:!ao,half,spg)}; }
  if(Math.min(dA,dB)===1){ let unc,neph,dn,uncIsA; if(dA===1){unc=A;neph=B;dn=dB;uncIsA=true;}else{unc=B;neph=A;dn=dA;uncIsA=false;} const lp=linkingParent(neph.id,lca); const lpG=lp?personById(lp).data.gender:null; const term=dn===2?tUncle(unc.data.gender,lpG,_older(birthYear(unc.id),lp?birthYear(lp):null)):(unc.data.gender==='M'?'ông họ':'bà họ'); const nephTerm=dn===2?'cháu':'cháu họ'; return uncIsA?{aToB:term,bToA:nephTerm}:{aToB:nephTerm,bToA:term}; }
  if(dA===dB){ const ao=_older(birthYear(A.id),birthYear(B.id)); return {aToB:tCous(A.data.gender,ao), bToA:tCous(B.data.gender,ao===null?null:!ao), note:`Anh/chị/em họ đời thứ ${dA-1}.`}; }
  return {sym:`Bà con họ hàng — chung tổ ${personName(lca)} (cách ${dA} và ${dB} đời).`};
}
function bloodLabelAtoB(aId,bId){ const A=personById(aId),B=personById(bId); if(!A||!B) return null; const aa=ancDist(aId),ab=ancDist(bId); let lca=null,best=1e9; aa.forEach((da,c)=>{ if(ab.has(c)){ const t=da+ab.get(c); if(t<best){best=t;lca=c;} } }); if(lca==null) return null; const r=nameBlood(A,B,aa.get(lca),ab.get(lca),lca); return r.aToB||null; }
function relationship(aId,bId){
  if(aId===bId) return {sym:'là cùng một người.'};
  const A=personById(aId), B=personById(bId); if(!A||!B) return {sym:'không tìm thấy.'};
  if(A.rels.spouses.includes(bId)) return {aToB:tSpouse(A.data.gender), bToA:tSpouse(B.data.gender)};
  const aa=ancDist(aId), ab=ancDist(bId);
  let lca=null,best=1e9; aa.forEach((da,c)=>{ if(ab.has(c)){ const t=da+ab.get(c); if(t<best){best=t;lca=c;} } });
  if(lca!=null){ const r=nameBlood(A,B,aa.get(lca),ab.get(lca),lca); return {...r, lca, pathA:pathUp(aId,lca), pathB:pathUp(bId,lca)}; }
  // qua hôn nhân: A là vợ/chồng của người có huyết thống với B
  for(const s of A.rels.spouses){ const lab=bloodLabelAtoB(s,bId); if(lab) return {sym:`là ${tSpouse(A.data.gender)} của ${personName(s)} — người là ${lab} của ${personName(bId)}. (Quan hệ qua hôn nhân.)`}; }
  for(const s of B.rels.spouses){ const lab=bloodLabelAtoB(s,aId); if(lab) return {sym:`${personName(bId)} là ${tSpouse(B.data.gender)} của ${personName(s)} — người là ${lab} của ${personName(aId)}. (Quan hệ qua hôn nhân.)`}; }
  return {sym:'không có quan hệ huyết thống trực tiếp trong gia phả (có thể là thông gia).'};
}

function renderRel(){
  const a=$('#rel-a').value, b=$('#rel-b').value, res=$('#rel-result');
  if(!a||!b){ res.innerHTML=''; return; }
  const r=relationship(a,b), nA=personName(a), nB=personName(b);
  let html='';
  if(r.sym){ html=`<div class="rel-line"><b>${escapeHtml(nA)}</b> ${escapeHtml(r.sym)}</div>`; }
  else {
    html=`<div class="rel-line"><b>${escapeHtml(nA)}</b> là <span class="rel-term">${escapeHtml(r.aToB)}</span> của ${escapeHtml(nB)}.</div>`+
         `<div class="rel-line"><b>${escapeHtml(nB)}</b> là <span class="rel-term">${escapeHtml(r.bToA)}</span> của ${escapeHtml(nA)}.</div>`;
    if(r.note) html+=`<div class="rel-note">${escapeHtml(r.note)}</div>`;
  }
  if(r.lca){ html+=`<div class="rel-note">Tổ chung: <b>${escapeHtml(personName(r.lca))}</b></div>`+
    `<div class="rel-path">${r.pathA.map(escapeHtml).join(' → ')}</div>`+
    `<div class="rel-path">${r.pathB.map(escapeHtml).join(' → ')}</div>`; }
  html+=`<div class="rel-foot">* Cách xưng hô có thể khác đôi chút theo vùng miền.</div>`;
  res.innerHTML=html;
}

/* ===========================================================================
   9) LỌC THEO CHI / NHÁNH — chỉ hiện một người gốc chi và con cháu
=========================================================================== */
function descendantsOf(id){ const set=new Set(); const q=[id]; while(q.length){ const c=q.shift(); if(set.has(c)) continue; set.add(c); const p=personById(c); if(p) p.rels.children.forEach(ch=>q.push(ch)); } return set; }
function isClanMember(d){
  // người trong tộc: là con cháu (có cha/mẹ trong gia phả) hoặc là thuỷ tổ, hoặc mang họ Hồ.
  // Người kết hôn vào (vợ/chồng ngoại tộc) không có cha mẹ trong cây nên bị loại.
  return d.rels.parents.length>0 || d.id===ROOT_ID || /^hồ\b/i.test(String(d.data.ho_ten||'').trim());
}
function populateBranchSelect(){
  const sel=$('#branch'); if(!sel) return;
  let opts=`<option value="">Toàn bộ gia phả</option>`;
  [...DATA].filter(d=> d.rels.children.length>0 && isClanMember(d))
    .sort((a,b)=>(a.data.gen_num-b.data.gen_num)|| a.data.ho_ten.localeCompare(b.data.ho_ten))
    .forEach(d=>{ opts+=`<option value="${escapeHtml(d.id)}">Đời ${escapeHtml(d.data.doi)} · ${escapeHtml(d.data.ho_ten)}</option>`; });
  sel.innerHTML=opts; sel.value='';
}
function applyBranch(headId){
  if(!headId){ render(DATA, ROOT_ID); return; }
  const keep=descendantsOf(headId);
  DATA.forEach(d=>{ if(keep.has(d.id)) d.rels.spouses.forEach(s=>keep.add(s)); });
  const sub=DATA.filter(d=>keep.has(d.id)).map(d=>({ id:d.id, data:d.data, rels:{
    parents: d.rels.parents.filter(p=>keep.has(p)),
    children:d.rels.children.filter(c=>keep.has(c)),
    spouses: d.rels.spouses.filter(s=>keep.has(s))
  }}));
  render(sub, headId);
}
$('#branch').onchange = e => applyBranch(e.target.value);

function noAccent(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[đĐ]/g,'d').toLowerCase(); }
function renderSearch(q){
  const box=$('#search-results'); const nq=noAccent(q).trim();
  let list=[...DATA];
  if(nq){ list=list.filter(d=>{ const hay=noAccent([d.data.ho_ten,d.data.tu,d.data.phap_danh].filter(Boolean).join(' ')); return hay.includes(nq); }); }
  list.sort((a,b)=> (a.data.gen_num-b.data.gen_num) || a.data.ho_ten.localeCompare(b.data.ho_ten,'vi'));
  if(!list.length){ box.innerHTML=`<div class="search-empty">Không tìm thấy ai khớp “${escapeHtml(q)}”.</div>`; return; }
  box.innerHTML = list.slice(0,80).map(d=>{
    const initial=(d.data.ho_ten||'?').trim().slice(-1).toUpperCase();
    const meta=[ d.data.doi?('Đời '+d.data.doi):'', d.data.tu?('Tự '+d.data.tu):'', d.data.phap_danh?('PD '+d.data.phap_danh):'' ].filter(Boolean).join(' · ');
    const gcl=d.data.gender==='F'?'f':(d.data.gender==='M'?'m':'');
    const av=d.data.anh?` style="background-image:url('${escapeHtml(d.data.anh)}')"`:'';
    return `<div class="person-row" data-id="${escapeHtml(d.id)}">
      <div class="p-av ${gcl}"${av}>${d.data.anh?'':escapeHtml(initial)}</div>
      <div class="p-main"><div class="p-name">${escapeHtml(d.data.ho_ten)}</div><div class="p-meta">${escapeHtml(meta)}</div></div></div>`;
  }).join('');
  box.querySelectorAll('.person-row').forEach(r=> r.onclick=()=>{ const p=DATA.find(x=>x.id===r.getAttribute('data-id')); if(p){ closeSearch(); openDetail(p); } });
}

/* Canh khung nhìn để cả một đời (theo trục thế hệ) đều lọt màn hình, đời đó nằm gần mép đầu */
function focusGen(n){
  try{
    const svg=document.querySelector('#FamilyChart svg.main_svg');
    const view=svg&&svg.querySelector('g.view');
    const tree=CHART&&CHART.store&&CHART.store.state&&CHART.store.state.tree;
    if(!svg||!view||!tree||!tree.data) return;
    const horiz=!!tree.is_horizontal;
    const nodes=tree.data.filter(t=>t&&t.data&&t.data.data&&t.data.data.gen_num===n&&!t.data.to_add);
    if(!nodes.length) return;
    const lvlOf=t=>horiz?t.x:t.y, spanOf=t=>horiz?t.y:t.x;
    const lvl=lvlOf(nodes[0]);
    let sMin=Infinity,sMax=-Infinity; nodes.forEach(t=>{const s=spanOf(t); if(s<sMin)sMin=s; if(s>sMax)sMax=s;});
    const rect=svg.getBoundingClientRect(); const W=rect.width||360, H=rect.height||480;
    const spanVP=horiz?H:W, lvlVP=horiz?W:H, CARD=240;
    let k=spanVP/((sMax-sMin)+CARD); k=Math.max(0.14, Math.min(k,0.85));
    const spanC=(sMin+sMax)/2, lvlMargin=lvlVP*0.20;
    let tx,ty;
    if(horiz){ tx=lvlMargin-lvl*k; ty=H/2-spanC*k; }
    else     { ty=lvlMargin-lvl*k; tx=W/2-spanC*k; }
    view.setAttribute('transform',`translate(${tx},${ty}) scale(${k})`);
    if(window.d3 && d3.zoomIdentity){ try{ svg.__zoom=d3.zoomIdentity.translate(tx,ty).scale(k); }catch(_){ } }
    drawGenSeparators();
  }catch(_){ }
}
function pickDoi(n){
  if(!CHART) return;
  showTab('tree', true);
  const root = (ROOT_ID && DATA.some(d=>d.id===ROOT_ID)) ? ROOT_ID : (DATA[0]&&DATA[0].id);
  CHART.updateMainId(root);                          // gốc = thuỷ tổ → cả cây, đầy đủ mọi người mỗi đời
  CHART.updateTree({tree_position:'fit'});
  if(n>0) setTimeout(()=> focusGen(n), 150);         // rồi canh vào đúng đời để thấy hết đời đó
}

<!-- PWA: đăng ký service worker để cài ra màn hình chính & chạy offline -->
<script>
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){ /* bỏ qua nếu không đăng ký được */ });
    });
  }
</script>
</body>
</html>
